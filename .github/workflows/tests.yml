name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv venv --python 3.14
          uv pip install -r requirements_test.txt "idotmatrix-api-client==0.2.3"
      - name: Run the tests
        run: uv run --no-sync python -m pytest -q
