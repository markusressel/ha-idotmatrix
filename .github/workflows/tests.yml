name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv venv --python 3.14
          # the library is installed from GitHub until the release that the manifest asks for is on PyPI
          uv pip install -r requirements_test.txt "idotmatrix-api-client @ git+https://github.com/markusressel/idotmatrix-api-client@main"
      - name: Run the tests
        run: uv run --no-sync python -m pytest -q
